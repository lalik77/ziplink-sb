spring:
  datasource:
    url: ${DATABASE_URL}
    password: ${DB_PASSWORD_PROD}
    username: ${DB_USERNAME_PROD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: ${DATABASE_DIALECT}
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 172800000
logging:
  level:
    org.springframework.security: DEBUG
    com.mami.ziplink: DEBUG

